<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>William Nuveen – Robotics Engineer</title>
<meta name="description" content="William Nuveen — Advanced Robotics Engineer in San Francisco. Consumables, cartridges and robotics hardware for cell therapy manufacturing.">
<meta property="og:title" content="William Nuveen – Robotics Engineer">
<meta property="og:description" content="Robotics, product design and automation — from consumer robots to CAR-T manufacturing.">
<meta property="og:image" content="https://williamnuveen.github.io/portfolio/WilliamNuveenPortrait.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1a2332">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
<script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a2332;--navy-light:#243044;--cream:#f5f0e8;--warm-gray:#e8e3db;
  --accent:#c8a96e;--accent-dark:#a8893e;
  --text-dark:#1a1a1a;--text-mid:#4a4a4a;--text-light:#6b6b6b;
  --serif:'DM Serif Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:62px}
body{font-family:var(--sans);background:var(--cream);color:var(--text-dark)}
img{display:block}
button{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--accent-dark);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 48px}
.serif{font-family:var(--serif)}
.label{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-dark);font-weight:600;margin-bottom:10px}
.on-dark .label,.label.on-dark{color:var(--accent)}
.h2{font-family:var(--serif);font-size:clamp(2rem,4vw,2.8rem);color:var(--navy);line-height:1.1}
.body{color:var(--text-mid);line-height:1.8;font-size:.97rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start}

/* buttons: navy text on gold for contrast */
.btn{display:inline-block;padding:13px 30px;border-radius:6px;font-weight:500;font-size:.88rem;letter-spacing:.05em;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:background .2s,transform .15s}
.btn-gold{background:var(--accent);color:var(--navy)}
.btn-gold:hover{background:#d6ba82;transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.18)}
.btn-ghost:hover{background:rgba(255,255,255,.15)}
.btn-dark{background:var(--navy);color:#fff}
.btn-dark:hover{background:var(--navy-light)}
.btn-sm{padding:10px 18px;font-size:.8rem}

/* NAV */
.site-header{position:fixed;top:0;left:0;right:0;z-index:500;background:rgba(245,240,232,.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,0,0,.07)}
.career .site-header{position:sticky}
.nav{max-width:1200px;margin:0 auto;padding:0 48px;height:62px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--serif);font-size:1.5rem;color:var(--navy);text-decoration:none}
.nav-links{display:flex;align-items:center;gap:28px}
.nav-link,.dropdown-trigger{font-size:.9rem;font-weight:500;letter-spacing:.03em;color:var(--text-mid);text-decoration:none;background:none;border:none;cursor:pointer;position:relative;padding:0 0 2px;transition:color .2s}
.nav-link::after,.dropdown-trigger::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--accent-dark);transition:width .3s}
.nav-link:hover,.dropdown:hover .dropdown-trigger{color:var(--navy)}
.nav-link:hover::after,.dropdown:hover .dropdown-trigger::after{width:100%}
.nav-cta{background:var(--navy);color:#fff;padding:8px 20px;border-radius:6px;font-size:.85rem}
.nav-cta:hover{background:var(--navy-light);color:#fff}
.nav-cta::after{display:none}
.dropdown{position:relative}
.dropdown-trigger{display:flex;align-items:center;gap:5px}
.chevron{width:11px;height:11px;opacity:.5;transition:transform .25s}
.dropdown:hover .chevron,.dropdown.open .chevron{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:14px;min-width:190px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200}
.dropdown:hover .dropdown-menu,.dropdown.open .dropdown-menu,.dropdown:focus-within .dropdown-menu{opacity:1;pointer-events:all}
.dropdown-menu-inner{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:10px;box-shadow:0 16px 48px rgba(0,0,0,.13);overflow:hidden}
.dropdown-item{display:block;width:100%;text-align:left;padding:12px 20px;font-size:.875rem;font-weight:500;color:var(--text-mid);background:none;border:none;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:hover{background:var(--cream);color:var(--navy)}
.dropdown-item.featured{color:var(--accent-dark);background:rgba(200,169,110,.07)}

/* HERO */
.hero{min-height:100vh;background:var(--navy);display:flex;align-items:center;position:relative;overflow:hidden;padding-top:62px}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 75% 40%,rgba(200,169,110,.1),transparent 55%);pointer-events:none}
.hero-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;position:relative}
.hero-kicker{font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
.hero-name{font-family:var(--serif);font-size:clamp(3.2rem,7vw,5.5rem);color:#fff;line-height:1.02;margin-bottom:20px}
.hero-sub{font-size:1.05rem;color:rgba(255,255,255,.6);font-weight:300}
.hero-photo{width:100%;max-width:400px;aspect-ratio:3/4;object-fit:cover;border-radius:16px;box-shadow:0 40px 100px rgba(0,0,0,.5);margin-left:auto}

/* STATS */
.stats{background:var(--navy-light);border-top:1px solid rgba(200,169,110,.25)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:40px 48px}
.stat-num{font-family:var(--serif);font-size:2.4rem;color:var(--accent);line-height:1}
.stat-txt{font-size:.85rem;color:rgba(255,255,255,.6);margin-top:8px;line-height:1.5}

/* MULTIPLY LABS */
.ml{background:var(--navy);padding:80px 0 100px}
.live{display:inline-flex;align-items:center;gap:10px;margin-bottom:24px;background:rgba(200,169,110,.15);color:var(--accent);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:6px 14px;border-radius:4px;border:1px solid rgba(200,169,110,.25)}
.live i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
.partners{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 40px}
.partner{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:16px 18px}
.partner b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem;color:#fff;margin-bottom:4px}
.partner span{font-size:.78rem;color:rgba(255,255,255,.5)}
.links{display:flex;gap:10px;flex-wrap:wrap}
.pill-link{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.16);padding:10px 18px;border-radius:6px;font-size:.8rem;font-weight:500;text-decoration:none}
.pill-link:hover{background:rgba(255,255,255,.14)}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* PHOTO TILE (clickable image) */
.tile{border:none;padding:0;background:var(--navy-light);border-radius:12px;overflow:hidden;cursor:zoom-in;display:block;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.tile:hover img{transform:scale(1.04)}

/* PORTFOLIO */
.section{padding:100px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.portfolio-card{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;background:var(--navy-light);border:none;padding:0;text-align:left;width:100%}
.portfolio-card img{width:100%;height:100%;object-fit:cover;transition:transform .5s,opacity .3s}
.portfolio-card:hover img{transform:scale(1.06);opacity:.55}
.card-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;background:linear-gradient(to top,rgba(15,25,45,.95),rgba(15,25,45,.3) 50%,transparent)}
.card-company{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
.card-title{font-family:var(--serif);color:#fff;font-size:1.1rem;line-height:1.3;margin-bottom:6px}
.card-sub{color:rgba(255,255,255,.75);font-size:.78rem;opacity:0;transform:translateY(5px);transition:opacity .3s,transform .3s}
.portfolio-card:hover .card-sub,.portfolio-card:focus-visible .card-sub{opacity:1;transform:none}
@media (hover:none){.card-sub{opacity:1;transform:none}.portfolio-card img{opacity:.7}}

/* TIMELINE */
.timeline-item{position:relative;padding-left:44px;padding-bottom:100px}
.timeline-item:last-child{padding-bottom:0}
.timeline-item::before{content:'';position:absolute;left:7px;top:14px;width:1px;height:calc(100% - 14px);background:linear-gradient(to bottom,rgba(168,137,62,.6),rgba(168,137,62,.05))}
.timeline-item:last-child::before{display:none}
.timeline-dot{position:absolute;left:0;top:10px;width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-dark);background:var(--warm-gray)}
.timeline-dot.now{background:var(--accent)}

/* SKILLS */
.skills{background:var(--navy);padding:80px 0;text-align:center}
.skill-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:50px;padding:12px 26px;font-size:1.02rem;font-weight:500;color:rgba(255,255,255,.88)}
.skill-pill i{width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* ABOUT */
.chip{background:var(--warm-gray);color:var(--navy);padding:9px 18px;border-radius:50px;font-size:.82rem;font-weight:500;border:none;cursor:pointer;transition:background .2s,color .2s}
.chip[aria-pressed=true]{background:var(--navy);color:#fff}
.gallery{margin-top:28px;padding:24px;background:var(--warm-gray);border-radius:14px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

/* OVERLAYS */
.modal-overlay{position:fixed;inset:0;background:rgba(10,15,25,.78);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-inner{background:#fff;border-radius:16px;max-width:860px;width:100%;max-height:90vh;overflow-y:auto}
.lb-close{position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:1.2rem;cursor:pointer}
.career{position:fixed;inset:0;z-index:800;background:var(--cream);overflow-y:auto}

.fade-up{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.fade-up.visible{opacity:1;transform:none}

footer{background:#111820;padding:28px 48px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer p,footer a{color:rgba(255,255,255,.5);font-size:.8rem;text-decoration:none}
footer a:hover{color:#fff}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fade-up{opacity:1;transform:none;transition:none}
  *{transition-duration:.01ms!important}
}
@media (max-width:900px){
  .wrap,.nav{padding:0 20px}
  .two-col,.hero-grid{grid-template-columns:1fr;gap:40px}
  .hero-photo{display:none}
  .stats-grid{grid-template-columns:1fr 1fr;padding:32px 20px}
  .nav-links{gap:16px}
  .hide-sm{display:none}
  .section,.ml{padding:64px 0}
  .timeline-item{padding-bottom:56px}
  .sticky-col{position:static!important}
}
@media (max-width:560px){
  .nav-links .nav-link:not(.nav-cta){font-size:.82rem}
  .partners{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>

<!-- Content lives in data.js: careerPages, aboutCategories, portfolioItems, experiences -->
<script src="data.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const SKILLS = ['Product Design & Development','Mass Manufacturing','Automation & Robotics','Electromechanical Systems','GD&T & Tolerancing','DFM&A','SolidWorks / Onshape','System Integration'];
const STATS = [
  ['300+','units per hour on bulky items with the Ocado depalletizing system'],
  ['750M+','items sorted by the Kindred Sort robot using my camera mount'],
  ['4','robotic arms in the Multiply Labs CAR-T manufacturing system'],
  ['Q4 2024','first Ocado depalletizer deployment, London'],
];
const PRESS = [
  ['AstraZeneca','https://www.businesswire.com/news/home/20260127453159/en/Multiply-Labs-Announces-New-Collaboration-to-Automate-Cell-Therapy-Manufacturing-with-Robotics'],
  ['Legend Biotech','https://www.businesswire.com/news/home/20240924666477/en/Multiply-Labs-Announces-a-Collaboration-on-Automating-Cell-Therapy-Manufacturing-with-Legend-Biotech'],
  ['Nvidia','https://blogs.nvidia.com/blog/multiply-labs-isaac-omniverse/'],
  ['Team Spotlight','https://www.linkedin.com/posts/engineeringexcellence-robotics-biomanufacturing-ugcPost-7344144321194901504-s3Ux'],
];
const PHOTO_SLOTS = {
  'multiply-labs':['Multiply_Labs_1.jpg','Multiply_Labs_2.jpg','Multiply_Labs_3.jpg'],
  'ocado':['depal.jpg','Camera_PC_2.jpg','Camera_PC_3.jpg'],
  'neato':['Nexaro_NR1500.jpg','Mopping_Robot.jpg','Neato_Parts.jpg'],
  'kohler':['Kohler_Work.jpg','Kohler_Bath_Spout.png','Kohler_Pres.jpg'],
};

// ─── HELPERS ───────────────────────────────────────────────
const FadeUp = ({ children, delay = 0 }) => {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { el.classList.add('visible'); obs.disconnect(); } }, { threshold: .08 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return <div ref={ref} className="fade-up" style={{ transitionDelay: `${delay}ms` }}>{children}</div>;
};

const Img = ({ src, alt, eager, ...rest }) =>
  <img src={src} alt={alt} loading={eager ? 'eager' : 'lazy'} decoding="async" {...rest} />;

// Escape to close + page scroll lock while an overlay is open
const useOverlay = (onClose) => {
  useEffect(() => {
    if (!onClose) return;
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = prev; };
  }, []);
};

const Lightbox = ({ src, onClose }) => {
  useOverlay(onClose);
  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-label="Image viewer"
         style={{ zIndex: 1300, cursor: 'zoom-out' }} onClick={onClose}>
      <Img src={src} alt="" eager onClick={e => e.stopPropagation()}
           style={{ maxWidth: '90vw', maxHeight: '90vh', borderRadius: 12, objectFit: 'contain', boxShadow: '0 32px 80px rgba(0,0,0,.7)' }} />
      <button className="lb-close" onClick={onClose} aria-label="Close image">×</button>
    </div>
  );
};

// Clickable photo that hides itself if the file is missing
const Photo = ({ src, alt, onOpen, style }) => {
  const [bad, setBad] = useState(false);
  if (bad) return null;
  return (
    <button className="tile" style={style} onClick={() => onOpen(src)} aria-label={`Enlarge: ${alt}`}>
      <Img src={src} alt={alt} onError={() => setBad(true)} />
    </button>
  );
};

// ─── NAV (shared by home + career pages) ───────────────────
const Nav = ({ onBack, onCareer, goTo }) => {
  const [open, setOpen] = useState(false);
  return (
    <header className="site-header">
      <nav className="nav" aria-label="Main">
        <a href="#" className="logo" onClick={e => { if (onBack) { e.preventDefault(); onBack(); } }}>WN</a>
        <div className="nav-links">
          {onBack
            ? <button className="nav-link" onClick={onBack}>← Back</button>
            : <a href="#" className="nav-link hide-sm">Home</a>}
          <div className={'dropdown' + (open ? ' open' : '')} onMouseLeave={() => setOpen(false)}>
            <button className="dropdown-trigger" aria-haspopup="true" aria-expanded={open} onClick={() => setOpen(o => !o)}>
              Career
              <svg className="chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg>
            </button>
            <div className="dropdown-menu"><div className="dropdown-menu-inner">
              {Object.entries(careerPages).map(([key, c], i) => (
                <button key={key} className={'dropdown-item' + (i === 0 ? ' featured' : '')}
                        onClick={() => { setOpen(false); onCareer(key); }}>
                  {i === 0 ? '✦ ' : ''}{c.company}
                </button>
              ))}
            </div></div>
          </div>
          <button className="nav-link" onClick={() => goTo('portfolio')}>Portfolio</button>
          <button className="nav-link hide-sm" onClick={() => goTo('about')}>About</button>
          <button className="nav-link hide-sm" onClick={() => goTo('resume')}>Resume</button>
          <button className="nav-link nav-cta" onClick={() => goTo('contact')}>Contact</button>
        </div>
      </nav>
    </header>
  );
};

// ─── PORTFOLIO MODAL ───────────────────────────────────────
const Modal = ({ item, onClose }) => {
  const [expanded, setExpanded] = useState(null);
  useOverlay(expanded ? null : onClose);
  return (
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-label={item.title}
         onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-inner">
        <div style={{ background: 'var(--navy)', padding: '40px 44px 32px' }}>
          <div className="label on-dark">{item.company}</div>
          <h2 className="serif" style={{ fontWeight: 400, fontSize: '2rem', color: '#fff' }}>{item.title}</h2>
        </div>
        <div style={{ padding: '36px 44px' }}>
          <p className="body">{item.longDescription}</p>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(220px,1fr))', gap: 10, marginTop: 28 }}>
            {item.images.map((img, i) => (
              <Photo key={img} src={img} alt={`${item.title}, photo ${i + 1}`} onOpen={setExpanded} style={{ aspectRatio: '4/3', borderRadius: 8 }} />
            ))}
          </div>
          <button className="btn btn-dark" style={{ marginTop: 32 }} onClick={onClose}>Close</button>
        </div>
      </div>
      {expanded && <Lightbox src={expanded} onClose={() => setExpanded(null)} />}
    </div>
  );
};

// ─── CAREER PAGE ───────────────────────────────────────────
const CareerPage = ({ pageKey, onClose, goHome }) => {
  const [lb, setLb] = useState(null);
  const [key, setKey] = useState(pageKey);
  const scroller = useRef(null);
  useOverlay(lb ? null : onClose);
  const data = careerPages[key];
  if (!data) return null;
  const photos = PHOTO_SLOTS[key] || [];
  const switchTo = k => { setKey(k); scroller.current && scroller.current.scrollTo(0, 0); };

  return (
    <div className="career" ref={scroller} role="dialog" aria-modal="true" aria-label={`${data.company} career page`}>
      <Nav onBack={onClose} onCareer={switchTo} goTo={goHome} />
      <div style={{ background: 'var(--navy)', padding: '80px 48px 60px', position: 'relative', overflow: 'hidden' }}>
        <div style={{ maxWidth: 860, margin: '0 auto', position: 'relative' }}>
          <div className="label on-dark" style={{ fontSize: '1rem', letterSpacing: '.16em' }}>{data.company}</div>
          <div style={{ fontSize: '.85rem', color: 'rgba(255,255,255,.55)', marginBottom: 16 }}>{data.location} · {data.dates}</div>
          <h1 className="serif" style={{ fontWeight: 400, fontSize: 'clamp(2rem,5vw,3.5rem)', color: '#fff', lineHeight: 1.05, marginBottom: 20 }}>{data.role}</h1>
          <p style={{ fontSize: '1.1rem', color: 'rgba(255,255,255,.65)', fontWeight: 300, maxWidth: 600 }}>{data.tagline}</p>
        </div>
      </div>
      <div style={{ maxWidth: 860, margin: '0 auto', padding: '48px 24px 80px' }}>
        {data.sections.map((sec, i) => (
          <section key={i} style={{ marginBottom: 56 }}>
            <h2 className="serif" style={{ fontWeight: 400, fontSize: '1.7rem', color: 'var(--navy)', marginBottom: 16 }}>{sec.heading}</h2>
            {sec.body.split('\n\n').map((p, j) => <p key={j} className="body" style={{ marginBottom: 16, maxWidth: '70ch' }}>{p}</p>)}
            {photos[i] && <Photo src={photos[i]} alt={`${data.company}, photo ${i + 1}`} onOpen={setLb} style={{ marginTop: 28, maxHeight: 420 }} />}
          </section>
        ))}
        {data.pressLinks.length > 0 && (
          <div style={{ paddingTop: 40, borderTop: '1px solid rgba(0,0,0,.08)' }}>
            <div className="label">Press & links</div>
            <div className="links">
              {data.pressLinks.map(({ label, href }) => (
                <a key={label} className="btn btn-dark btn-sm" href={href} target="_blank" rel="noopener noreferrer">{label} ↗</a>
              ))}
            </div>
          </div>
        )}
