<style>
:root{
  --navy:#1a2332;--navy-light:#243044;--cream:#f5f0e8;--warm-gray:#e8e3db;
  --accent:#c8a96e;--accent-dark:#a8893e;
  --text-dark:#1a1a1a;--text-mid:#4a4a4a;--text-light:#6b6b6b;
  --serif:'DM Serif Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:62px;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--cream);color:var(--text-dark)}
img{display:block}
button{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--accent-dark);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 48px}
.serif{font-family:var(--serif)}
.label{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-dark);font-weight:600;margin-bottom:10px}
.on-dark .label,.label.on-dark{color:var(--accent)}
.h2{font-family:var(--serif);font-size:clamp(2rem,4vw,2.8rem);color:var(--navy);line-height:1.1}
.body{color:var(--text-mid);line-height:1.8;font-size:.97rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start}
.two-col.exp{grid-template-columns:1fr 2fr}

/* buttons: navy text on gold for contrast */
.btn{display:inline-block;padding:13px 30px;border-radius:6px;font-weight:500;font-size:.88rem;letter-spacing:.05em;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:background .2s,transform .15s}
.btn-gold{background:var(--accent);color:var(--navy)}
.btn-gold:hover{background:#d6ba82;transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.18)}
.btn-ghost:hover{background:rgba(255,255,255,.15)}
.btn-dark{background:var(--navy);color:#fff}
.btn-dark:hover{background:var(--navy-light)}
.btn-sm{padding:10px 18px;font-size:.8rem}

/* NAV */
.site-header{position:fixed;top:0;left:0;right:0;z-index:500;background:rgba(26,35,50,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07)}
.career .site-header{position:sticky;background:var(--navy)}
.nav{max-width:1200px;margin:0 auto;padding:0 48px;height:62px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--serif);font-size:1.5rem;color:#fff;text-decoration:none;letter-spacing:.02em}
.logo span{color:var(--accent)}
.nav-links{display:flex;align-items:center;gap:28px}
.nav-link,.dropdown-trigger{font-size:.9rem;font-weight:500;letter-spacing:.03em;color:rgba(255,255,255,.72);text-decoration:none;background:none;border:none;cursor:pointer;position:relative;padding:0 0 2px;transition:color .2s}
.nav-link::after,.dropdown-trigger::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--accent);transition:width .3s}
.nav-link:hover,.dropdown:hover .dropdown-trigger{color:#fff}
.nav-link:hover::after,.dropdown:hover .dropdown-trigger::after{width:100%}
.nav-cta{background:var(--accent);color:var(--navy);padding:8px 20px;border-radius:6px;font-size:.85rem;font-weight:600}
.nav-cta:hover{background:#d6ba82;color:var(--navy)}
.nav-cta::after{display:none}
.dropdown{position:relative}
.dropdown-trigger{display:flex;align-items:center;gap:5px}
.chevron{width:11px;height:11px;opacity:.5;transition:transform .25s}
.dropdown:hover .chevron,.dropdown.open .chevron{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:14px;min-width:190px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200}
.dropdown:hover .dropdown-menu,.dropdown.open .dropdown-menu,.dropdown:focus-within .dropdown-menu{opacity:1;pointer-events:all}
.dropdown-menu-inner{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:10px;box-shadow:0 16px 48px rgba(0,0,0,.13);overflow:hidden}
.dropdown-item{display:block;width:100%;text-align:left;padding:12px 20px;font-size:.875rem;font-weight:500;color:var(--text-mid);background:none;border:none;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:hover{background:var(--cream);color:var(--navy)}
.dropdown-item.featured{color:var(--accent-dark);background:rgba(200,169,110,.07)}

/* HERO */
.hero{min-height:100vh;min-height:100svh;background:var(--navy);display:flex;align-items:center;position:relative;overflow:hidden;padding-top:62px}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 75% 40%,rgba(200,169,110,.12),transparent 55%);pointer-events:none}
.hero::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 70% 45%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 70% 45%,#000 10%,transparent 70%);pointer-events:none}
.hero-grid{z-index:1}
.hero-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;position:relative}
.hero-kicker{font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px;line-height:1.5}
.hero-name{font-family:var(--serif);font-size:clamp(3.2rem,7vw,5.5rem);color:#fff;line-height:1.02;margin-bottom:20px}
.hero-sub{font-size:1.05rem;color:rgba(255,255,255,.6);font-weight:300;line-height:1.5}
.hero-photo-wrap{position:relative;width:100%;max-width:400px;margin-left:auto}
.hero-photo-wrap::before{content:'';position:absolute;inset:20px -20px -20px 20px;border:1px solid rgba(200,169,110,.5);border-radius:18px}
.hero-photo{position:relative;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 30%;border-radius:16px;box-shadow:0 40px 100px rgba(0,0,0,.5)}

/* STATS */
.stats{background:var(--navy-light);border-top:1px solid rgba(200,169,110,.25)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:40px 48px}
.stat-num{font-family:var(--serif);font-size:clamp(1.5rem,2.6vw,2.4rem);color:var(--accent);line-height:1}
.stat-txt{font-size:.85rem;color:rgba(255,255,255,.6);margin-top:10px;line-height:1.5;max-width:30ch}
.stats-grid>div+div{border-left:1px solid rgba(255,255,255,.09);padding-left:24px}

/* MULTIPLY LABS */
.ml{background:var(--navy);padding:80px 0 100px}
.live{display:inline-flex;align-items:center;gap:10px;margin-bottom:24px;background:rgba(200,169,110,.15);color:var(--accent);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:6px 14px;border-radius:4px;border:1px solid rgba(200,169,110,.25)}
.live i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
.partners{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 40px}
.partner{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:16px 18px}
.partner b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem;color:#fff;margin-bottom:4px}
.partner span{font-size:.78rem;color:rgba(255,255,255,.5)}
.links{display:flex;gap:10px;flex-wrap:wrap}
.press{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)}
.press-label{width:100%;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:600;margin-bottom:4px}
.press a{color:rgba(255,255,255,.82);text-decoration:none;font-size:.88rem;border-bottom:1px solid rgba(200,169,110,.35);padding-bottom:2px;transition:color .2s,border-color .2s}
.press a:hover{color:#fff;border-color:var(--accent)}
.pill-link{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.16);padding:10px 18px;border-radius:6px;font-size:.8rem;font-weight:500;text-decoration:none}
.pill-link:hover{background:rgba(255,255,255,.14)}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* PHOTO TILE (clickable image) */
.tile{border:none;padding:0;background:var(--navy-light);border-radius:12px;overflow:hidden;cursor:zoom-in;display:block;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.tile:hover img{transform:scale(1.04)}

/* PORTFOLIO */
.section{padding:100px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.cards>.fade-up{height:100%}
.pcard{display:flex;flex-direction:column;width:100%;height:100%;padding:0;text-align:left;cursor:pointer;background:#fff;border:1px solid rgba(26,35,50,.08);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(26,35,50,.05);transition:transform .25s,box-shadow .25s,border-color .25s}
.pcard:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(26,35,50,.13);border-color:rgba(168,137,62,.35)}
.pcard-img{aspect-ratio:16/10;overflow:hidden;background:var(--warm-gray)}
.pcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pcard:hover .pcard-img img{transform:scale(1.05)}
.pcard-body{display:flex;flex-direction:column;gap:6px;flex:1;padding:20px 22px 22px}
.card-company{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark);font-weight:600}
.card-title{font-family:var(--serif);font-weight:400;color:var(--navy);font-size:1.3rem;line-height:1.25}
.card-sub{color:var(--text-mid);font-size:.88rem;line-height:1.6}
.card-more{margin-top:auto;padding-top:12px;font-size:.8rem;font-weight:600;letter-spacing:.04em;color:var(--accent-dark)}
.pcard:hover .card-more{color:var(--navy)}

/* TIMELINE */
.timeline-item{position:relative;padding-left:44px;padding-bottom:60px}
.timeline-item.last{padding-bottom:0}
.timeline-item::before{content:'';position:absolute;left:7px;top:14px;width:1px;height:calc(100% - 14px);background:linear-gradient(to bottom,rgba(168,137,62,.6),rgba(168,137,62,.05))}
.timeline-item.last::before{display:none}
.timeline-dot{position:absolute;left:0;top:10px;width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-dark);background:var(--warm-gray)}
.timeline-dot.now{background:var(--accent)}

/* SKILLS */
.skills{background:var(--navy);padding:80px 0;text-align:center}
.skill-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:50px;padding:12px 26px;font-size:1.02rem;font-weight:500;color:rgba(255,255,255,.88)}
.skill-pill i{width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* ABOUT */
.chip{background:var(--warm-gray);color:var(--navy);padding:9px 18px;border-radius:50px;font-size:.82rem;font-weight:500;border:none;cursor:pointer;transition:background .2s,color .2s}
.chip[aria-pressed=true]{background:var(--navy);color:#fff}
.gallery{margin-top:28px;padding:24px;background:var(--warm-gray);border-radius:14px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

/* OVERLAYS */
.modal-overlay{position:fixed;inset:0;background:rgba(10,15,25,.78);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-inner{background:#fff;border-radius:16px;max-width:860px;width:100%;max-height:90vh;overflow-y:auto}
.lb-close{position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:1.2rem;cursor:pointer}
.career{position:fixed;inset:0;z-index:800;background:var(--cream);overflow-y:auto}

.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--navy);padding:10px 16px;border-radius:6px;z-index:2000;font-weight:600;text-decoration:none}
.skip:focus{left:8px}
[tabindex="-1"]:focus{outline:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.hero-lede{font-size:.98rem;color:rgba(255,255,255,.6);font-weight:300;line-height:1.7;max-width:46ch;margin-top:16px}
.hl{margin:10px 0 0 1.1em;color:var(--text-mid);line-height:1.75;font-size:.97rem;max-width:70ch}
.hl li{margin-bottom:8px}
.skill-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:36px;text-align:left}
.skill-groups .label{margin-bottom:14px}
.skill-groups .skill-pill{padding:8px 16px;font-size:.88rem}
.edu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:48px;text-align:left}
.edu-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:18px 20px}
.edu-card b{display:block;font-family:var(--serif);font-weight:400;font-size:1.1rem;color:#fff;margin-bottom:4px}
.edu-card span{font-size:.82rem;color:rgba(255,255,255,.6)}
.menu-btn{display:none;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-10px;background:none;border:none;color:#fff;cursor:pointer}
.mobile-menu{position:absolute;left:0;right:0;top:100%;background:var(--navy);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 18px 40px rgba(0,0,0,.14);max-height:calc(100vh - 62px);overflow-y:auto;padding:8px 20px 20px}
.mm-item{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.08);padding:15px 4px;font-size:1.02rem;font-weight:500;color:#fff;cursor:pointer}
.mm-group{padding:14px 4px 4px;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.mm-sub{padding-left:16px;font-weight:400;color:rgba(255,255,255,.72)}
.mm-cta{margin-top:16px;border:none;text-align:center;background:var(--accent);color:var(--navy);border-radius:8px;font-weight:600}
.js .fade-up{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.js .fade-up.visible{opacity:1;transform:none}

footer{background:#111820;padding:28px 48px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer p,footer a{color:rgba(255,255,255,.5);font-size:.8rem;text-decoration:none}
footer a:hover{color:#fff}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fade-up{opacity:1;transform:none;transition:none}
  *{transition-duration:.01ms!important}
}
@media (max-width:900px){
  .wrap,.nav{padding:0 20px}
  .two-col,.two-col.exp,.hero-grid{grid-template-columns:1fr;gap:40px}
  .hero-grid{gap:28px}
  .hero{padding:92px 0 56px}
  .hero-photo{border-radius:14px}
  .stats-grid{grid-template-columns:1fr 1fr;padding:32px 20px}
  .nav-links{display:none}
  .menu-btn{display:flex}
  .section,.ml{padding:64px 0}
  .timeline-item{padding-bottom:48px}
  .stats-grid>div+div{border-left:none;padding-left:0}
  .hero-photo-wrap{order:-1;width:160px;max-width:160px;margin:0}
  .hero-photo-wrap::before{inset:8px -8px -8px 8px}
  .sticky-col{position:static!important}
  footer{padding:24px 20px}
  .modal-pad{padding:28px 22px!important}
  .career-hero{padding:56px 20px 44px!important}
  .skill-groups,.edu{grid-template-columns:1fr}
}
@media (max-width:560px){
  .partners{grid-template-columns:1fr}
}
</style>
</head>

<div id="root"><!--APP--></div>
